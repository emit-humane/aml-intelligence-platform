[project]
name = "aml-intelligence-platform"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Data
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "scipy>=1.11",
    # Synthetic generation
    "faker>=19.0",
    # Graph
    "networkx>=3.2",
    "infomap>=1.7",
    # Classical ML
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "imbalanced-learn>=0.12",
    "joblib>=1.3",
    # Deep learning
    "torch>=2.1",
    "torch-geometric>=2.4",
    "torch-geometric-temporal>=0.54",
    # PyG C++ extensions — pre-built Windows CPU wheels (no MSVC required)
    "torch-scatter",
    "torch-sparse",
    "torch-cluster",
    "torch-spline-conv",
    # Geo
    "geopy>=2.4",
    # API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # DB
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    # Plotting (System 3)
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.10",
]

# Pin torch to 2.2.0 (CPU); 2.4.0 fbgemm.dll requires libomp140 (not on this system),
# while 2.2.0 uses libiomp5md.dll which is bundled inside the wheel.
[tool.uv]
constraint-dependencies = ["torch==2.2.0", "numpy<2.0"]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.uv.sources]
torch = { url = "https://download.pytorch.org/whl/cpu/torch-2.2.0%2Bcpu-cp311-cp311-win_amd64.whl" }
torch-scatter = { url = "https://data.pyg.org/whl/torch-2.2.0%2Bcpu/torch_scatter-2.1.2%2Bpt22cpu-cp311-cp311-win_amd64.whl" }
torch-sparse = { url = "https://data.pyg.org/whl/torch-2.2.0%2Bcpu/torch_sparse-0.6.18%2Bpt22cpu-cp311-cp311-win_amd64.whl" }
torch-cluster = { url = "https://data.pyg.org/whl/torch-2.2.0%2Bcpu/torch_cluster-1.6.3%2Bpt22cpu-cp311-cp311-win_amd64.whl" }
torch-spline-conv = { url = "https://data.pyg.org/whl/torch-2.2.0%2Bcpu/torch_spline_conv-1.2.2%2Bpt22cpu-cp311-cp311-win_amd64.whl" }
