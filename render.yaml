services:
  - type: web
    name: aml-intelligence-platform
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn system2_platform.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ARTIFACT_STORE_PATH
        value: ./data/artifacts
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: FRONTEND_ORIGIN
        value: https://aml-intelligence-platform.vercel.app
